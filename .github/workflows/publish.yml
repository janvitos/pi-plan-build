name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install current npm
        run: npm install --global npm@latest

      - name: Install tested Pi baseline for prepublish tests
        run: npm install --ignore-scripts --no-package-lock --no-save @earendil-works/pi-coding-agent@0.84.2 @earendil-works/pi-tui@0.84.2

      - name: Publish package
        run: npm publish --access public --provenance
